{% if page.ficha_tecnica and page.ficha_tecnica.size > 0 %}
<div id="ficha-tecnica" class="specs-table-wrapper"><table class="specs-table"><thead><tr><th scope="col">Especificação</th><th scope="col">Detalhes</th></tr></thead><tbody>
{% for item in page.ficha_tecnica %}<tr><th scope="row">{{ item.campo | escape }}</th><td>{{ item.valor | escape }}</td></tr>{% endfor %}
</tbody></table></div>
{% endif %}
